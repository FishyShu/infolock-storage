<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IL1:{"id":"boot","ok":false}</title>
<meta name="robots" content="noindex">
</head>
<body>
<!--
Infolock settings storage page (same pattern as UMM's and BetterMap's).

Infolock loads this page in a hidden CitadelHTMLPanel (the game's embedded
Chromium). Panorama has no storage API, but this page's localStorage survives a
game restart. Requests arrive as the URL fragment (SetURL accepts only https://
URLs since the 2026-10-01 game update); answers go back through document.title,
which Panorama receives as the HTMLTitle event.

Request:  #il1.<id>.<op>[.<base64url payload>]   op = get | set | del
Answer:   title "IL1:" + JSON {id, ok, op, value?, err?}

THE URL IS A CONTRACT: localStorage belongs to the page's origin, and
infolock.js has Store.PAGE_URL compiled in. Moving this page loses every
player's saved layout. Touches exactly one localStorage key and never puts
request data into the DOM.
-->
<script>
(function () {
    "use strict";
    var PROTOCOL = "il1";
    var TITLE_PREFIX = "IL1:";
    var STORAGE_KEY = "infolock.settings.v1";
    var MAX_VALUE_CHARS = 2048;

    function answer(obj) { document.title = TITLE_PREFIX + JSON.stringify(obj); }

    function fromBase64Url(s) {
        var b64 = s.replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) { b64 += "="; }
        return atob(b64);
    }

    function handle(fragment) {
        var parts = String(fragment).replace(/^#/, "").split(".");
        if (parts.length < 3 || parts[0] !== PROTOCOL) { return; }
        var id = parts[1];
        var op = parts[2];
        if (!/^[A-Za-z0-9_-]{1,32}$/.test(id)) { return; }
        try {
            if (op === "get") {
                answer({ id: id, ok: true, op: op, value: localStorage.getItem(STORAGE_KEY) });
            } else if (op === "set") {
                var value = fromBase64Url(parts[3] || "");
                if (value.length > MAX_VALUE_CHARS) { throw new Error("value too long"); }
                JSON.parse(value);   // Infolock stores JSON only
                localStorage.setItem(STORAGE_KEY, value);
                answer({ id: id, ok: localStorage.getItem(STORAGE_KEY) === value, op: op });
            } else if (op === "del") {
                localStorage.removeItem(STORAGE_KEY);
                answer({ id: id, ok: true, op: op });
            } else {
                answer({ id: id, ok: false, op: op, err: "unknown op" });
            }
        } catch (e) {
            answer({ id: id, ok: false, op: op, err: String(e && e.message || e) });
        }
    }

    window.addEventListener("hashchange", function () { handle(location.hash); });

    var storageOk = false;
    try {
        localStorage.setItem(STORAGE_KEY + ".probe", "1");
        localStorage.removeItem(STORAGE_KEY + ".probe");
        storageOk = true;
    } catch (e) {}
    answer({ id: "ready", ok: storageOk, v: 1 });
    if (location.hash) { handle(location.hash); }
})();
</script>
</body>
</html>
